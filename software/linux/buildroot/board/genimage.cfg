image boot.vfat {
 vfat {
  files = { "boot.bin", "u-boot.itb", "qspi.bin", "system.dtb", "Image" }
  file extlinux/extlinux.conf { image = "extlinux.conf" }
 }
 size = 256M
}
image sdcard.img {
 hdimage { disk-signature = 0x1045a7a0 }
 partition boot { partition-type = 0xC bootable = "true" image = "boot.vfat" }
 partition rootfs { partition-type = 0x83 image = "rootfs.ext4" }
}
